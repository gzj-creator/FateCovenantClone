syntax = "proto3";

// 中控上的账号角色列表
// 注意：这个结构需要和中控上的定义保持一致，如果修改必须中控和游戏同时修改
message pb_account_roles {
    repeated pb_account_role roles = 1;
}

// 注意：这个结构需要和中控上的定义保持一致，如果修改必须中控和游戏同时修改
message pb_account_role {
    uint64 role_id = 1;     // 角色id
    uint64 level = 2;       // 角色等级
    string name = 3;        // 角色名字
    int32 figure = 4;       // 角色形象
    int32 privilege = 5;    // 角色特权
}


// 客户端登录所需的逻辑服信息
message pb_login_server {
    int32 id = 1;           //  32bits服务器ID：自增数字，平台生成，内部使用
    string name = 2;        // 	服务器名称：官方苹果/安卓，如“S1测试服”；越狱苹果/安卓，如“Y1测试服”，编号和文字间一个空格
    int32 state = 3;        //  32bits服务器状态：0启用，1停新，2停用
    int32 label = 4;        //  32bits服务器标签，0正常，1推荐，2新服
    int32 show_state = 5;   //  32bits服务器显示：0正常，1流畅，2爆满
    int32 show_time = 6;    //  32bits服务器显示时间（时间戳，精度到秒）
    int32 release_time = 7; //  32bits服务器开放时间（时间戳，精度到秒）
    int32 start_maintain_time = 8;  //  32bits维护开始时间（时间戳，精度到秒）
    int32 stop_maintain_time = 9;   //  32bits维护结束时间（时间戳，精度到秒）
    string extranet_ip = 10;        //  外网地址 = IP:PORT，比如"192.168.20.143:3030"
    string nick_name = 13;          // 服务器昵称
    int32 cross_stage = 14;     // 逻辑服的跨服阶段（0：单服，1：双子，2：四极，3：神域跨服）
}

// 客户端登录所需的逻辑服列表
message pb_login_servers {
    repeated pb_login_server servers = 1;
    uint32 privilege_lv = 2;            // 账号特权等级
    bytes channel_id = 3;   // 渠道id
    repeated pb_account_role roles = 4;        // 角色列表信息
    uint64 now_sec = 5;     // 当前时间戳：用于客户端判断逻辑服是否可以显示用（客户端可能时间会和服务端不一致）
    bool limit_login = 6;   // 是否限制登录：机器达到了登录和排队上限，客户端会提示满员稍后重试
    uint64 open_time = 7; // 游戏首发开服时间
    uint64 ahead_time = 8; // 游戏可以提前进入的时间
    uint64 role_count = 9; // 已经拥有的角色数量，用于客户端区分是老号还是新号
}